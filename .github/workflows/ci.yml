name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @Apnium Technology/antonic-agent build:web

  build-den-control-plane:
    name: Build Den control plane
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build den control plane
        run: pnpm --filter @antonic-agent/den-control-plane build

  build-orchestrator-binary:
    name: Build antonic-agent orchestrator binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck antonic-agent-orchestrator
        run: pnpm --filter antonic-agent-orchestrator typecheck

      - name: Build antonic-agent orchestrator binary
        run: pnpm --filter antonic-agent-orchestrator build:bin

      - name: Validate compiled binary
        run: |
          ./packages/orchestrator/dist/bin/antonic-agent --version
          ./packages/orchestrator/dist/bin/antonic-agent --help >/dev/null
